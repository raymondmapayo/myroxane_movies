[package]
name = "lantaw_adblock_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
adblock = { version = "0.13.3", default-features = false, features = [
  "embedded-domain-resolver",
  "full-regex-handling",
] }
flutter_rust_bridge = "=2.12.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
